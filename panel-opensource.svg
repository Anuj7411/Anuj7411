<g opacity="0" transform="translate(-6,0)"><animate attributeName="opacity" to="1" begin="0.15s" dur="0.45s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="-6,0" to="0,0" begin="0.15s" dur="0.45s" fill="freeze"/><text x="28" y="91" fill="#c9d1d9">Pull requests merged across five LLM-observability platforms -- Comet Opik, BerriAI</text><text x="28" y="112" fill="#c9d1d9">LiteLLM, and more -- fixing 2x-16x billing bugs on flagship models and recovering 500+</text><text x="28" y="133" fill="#c9d1d9">dropped model entries. Every fix ships with a regression test.</text></g>
