<text x="94" y="25" fill="#8b949e">anuj@github:~$ ls projects/</text>
<g opacity="0" transform="translate(-6,0)"><animate attributeName="opacity" to="1" begin="0.15s" dur="0.45s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="-6,0" to="0,0" begin="0.15s" dur="0.45s" fill="freeze"/><text x="28" y="98" fill="#39d353" font-weight="700">Sipcode<tspan fill="#8b949e" font-weight="400">  AI coding-agent tooling</tspan></text><text x="28" y="119" fill="#c9d1d9">MCP server that cuts AI coding-agent token use by a 62.6% median on a locked benchmark. On</text><text x="28" y="140" fill="#c9d1d9">the Official MCP Registry; #12 of 1,086 on Product Hunt.</text></g>
<g opacity="0" transform="translate(-6,0)"><animate attributeName="opacity" to="1" begin="0.27s" dur="0.45s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="-6,0" to="0,0" begin="0.27s" dur="0.45s" fill="freeze"/><text x="28" y="168" fill="#39d353" font-weight="700">AnswerFox<tspan fill="#8b949e" font-weight="400">  AI-readiness platform</tspan></text><text x="28" y="189" fill="#c9d1d9">Audits how AI crawlers actually read a site, then ships the fixes as GitHub PRs and</text><text x="28" y="210" fill="#c9d1d9">re-audits on merge. Built on RSC, Drizzle/Supabase (RLS), Inngest, Cloudflare.</text></g>
<g opacity="0" transform="translate(-6,0)"><animate attributeName="opacity" to="1" begin="0.39s" dur="0.45s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="-6,0" to="0,0" begin="0.39s" dur="0.45s" fill="freeze"/><text x="28" y="238" fill="#39d353" font-weight="700">Judix<tspan fill="#8b949e" font-weight="400">  agent evals infrastructure</tspan></text><text x="28" y="259" fill="#c9d1d9">Real-time evals for AI agents and RAG. A Rust core scores every step live at ~$0</text><text x="28" y="280" fill="#c9d1d9">(deterministic rules plus a model judge). Streaming API, CLI, LangChain / CrewAI / Codex</text><text x="28" y="301" fill="#c9d1d9">hooks.</text></g>
<g opacity="0" transform="translate(-6,0)"><animate attributeName="opacity" to="1" begin="0.51s" dur="0.45s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="-6,0" to="0,0" begin="0.51s" dur="0.45s" fill="freeze"/><text x="28" y="329" fill="#39d353" font-weight="700">Sotto<tspan fill="#8b949e" font-weight="400">  consumer web app</tspan></text><text x="28" y="350" fill="#c9d1d9">Anonymous Secret Santa, shipped solo in 14 days and launched on Product Hunt. Privacy</text><text x="28" y="371" fill="#c9d1d9">enforced at the database layer (Sattolo shuffle + bcrypt + RLS), not as a toggle.</text></g>
</svg>